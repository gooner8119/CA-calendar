<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>주식 권리일정 캘린더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#F58220; --orange-active:#CB6015; --orange-soft:#FAB072; --blue:#043B72;
  --bg:#FFFFFF; --surface:#F7F8FA; --surface2:#ECEFF4; --line:#CDCECB; --line-soft:#E5E4E1;
  --ink:#1A1A1A; --body:#3D3D3D; --muted:#6C6C6C; --muted2:#84888B;
  --today:#FFF3E8; --weekend:#F1F3F6; --sat:#0086B8; --warn:#B7791F; --warn-bg:#FFF6E0; --danger:#C62828;
  --c-div:#F58220; --c-bonus:#043B72; --c-split:#0086B8; --c-rights:#AD624E; --c-rights3:#6E3F8F; --c-merge:#00A9CE; --c-capred:#C62828; --c-other:#84888B;
  --shadow:0 8px 28px rgba(0,0,0,.14);
}
/* 다크모드 비활성: 항상 밝은 배경으로 고정(직원 화면 통일) */
:root,:root[data-theme="dark"]{color-scheme:light only}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--body);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.page{max-width:1200px;margin:0 auto;padding:16px 20px 48px}
@media (max-width:640px){.page{padding:12px 16px 40px}}

/* header */
.rule{height:1px;background:var(--orange);margin:0 0 12px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px}
h1{margin:0;font-size:24px;font-weight:700;color:var(--ink);letter-spacing:-.3px;line-height:1.25}
@media (max-width:640px){h1{font-size:20px}}
.status{font-size:13px;color:var(--muted);margin-top:4px}
.status b{color:var(--body);font-weight:500}
.status .warn{color:var(--warn)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:3px;padding:10px 18px;font-size:15px;font-weight:500;color:var(--body);min-height:44px}
.btn:hover{background:var(--surface)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.cell:focus-visible,.row:focus-visible{outline:2px solid var(--orange);outline-offset:1px}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.primary:hover{background:var(--orange-active);border-color:var(--orange-active)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.arm{background:var(--danger);color:#fff}
.btn.ok{color:var(--warn);border-color:var(--warn)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 12px}
.search{flex:1 1 220px;min-width:180px;position:relative}
.search input{width:100%;padding:11px 34px 11px 12px;border:1px solid var(--line);border-radius:2px;background:var(--bg);min-height:44px}
.search .clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:18px;padding:4px 8px;display:none}
.search.has .clr{display:block}
.chips{display:flex;gap:0;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.chip{border:0;background:var(--bg);padding:10px 16px;font-size:14px;font-weight:500;color:var(--muted);min-height:44px}
.chip+.chip{border-left:1px solid var(--line)}
.chip[aria-pressed="true"]{background:var(--orange);color:#fff}
.chip.rev[aria-pressed="true"]{background:var(--warn);color:#fff}
.chip:hover:not([aria-pressed="true"]){background:var(--surface);color:var(--ink)}
select.sel{padding:10px 12px;border:1px solid var(--line);border-radius:2px;background:var(--bg);min-height:44px;font-size:15px}

/* calendar */
.cal-nav{display:flex;flex-direction:column;align-items:center;gap:2px;margin:10px 0 8px}
.nav-c{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.cal-nav h2{margin:0;font-size:22px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;min-width:150px;text-align:center}
.btn.nav{min-width:46px;min-height:46px;padding:8px 14px;font-size:22px;line-height:1;font-weight:500}
.btn.nav.today{font-size:15px;margin-left:8px}
@media (max-width:640px){.cal-nav h2{font-size:19px;min-width:120px}.btn.nav{min-width:42px;min-height:42px;font-size:20px}}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:12px;font-weight:500;color:var(--muted);text-align:center;border-left:1px solid var(--line-soft);border-top:1px solid var(--line-soft)}
.wk span{min-width:0;overflow:hidden;padding:6px 4px;background:var(--surface);border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line)}
.wk span:first-child{color:var(--danger)}.wk span:last-child{color:var(--sat)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line-soft)}
.cell{border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);border-top:0;border-left:0;min-height:96px;padding:4px;background:var(--bg);text-align:left;display:flex;flex-direction:column;gap:2px;position:relative;cursor:pointer;width:100%;min-width:0;max-width:100%;overflow:hidden;box-sizing:border-box;font:inherit}
.cell:hover{background:var(--surface)}
/* 다른 달 날짜: 흰 바탕에 흐린 글씨(휴장일 아님). 회색 바탕은 휴장일에만 */
.cell.out{background:var(--bg);color:var(--muted2)}
.cell.out .dn{color:var(--muted2)}
.cell.out .ev{opacity:.6}
.cell.closed{background:var(--weekend)}
.cell.red .dn{color:var(--danger)}
.cell.blue .dn{color:var(--sat)}
.cell.out.red .dn,.cell.out.blue .dn{opacity:.55}
.cell.today{background:var(--today)}
/* 이번 주: 굵은 주황 테두리 사각형 */
.cell.cw{box-shadow:inset 0 3px 0 var(--orange),inset 0 -3px 0 var(--orange)}
.cell.cw.cw-l{box-shadow:inset 3px 0 0 var(--orange),inset 0 3px 0 var(--orange),inset 0 -3px 0 var(--orange)}
.cell.cw.cw-r{box-shadow:inset -3px 0 0 var(--orange),inset 0 3px 0 var(--orange),inset 0 -3px 0 var(--orange)}
.cell.cw.cw-l.cw-r{box-shadow:inset 0 0 0 3px var(--orange)}
.cell.sel{box-shadow:inset 0 0 0 2px var(--blue)}
.cell.cw.sel{box-shadow:inset 0 0 0 2px var(--blue),inset 0 3px 0 var(--orange),inset 0 -3px 0 var(--orange)}
.dn{font-size:13px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.2;display:flex;align-items:baseline;gap:3px;flex-wrap:wrap}
.cell.today .dn{color:var(--orange);font-weight:700}
.dn .hol{font-size:10px;color:var(--danger);font-weight:500}
.sq{display:inline-flex;width:16px;height:16px;align-items:center;justify-content:center;background:var(--c);color:#fff;font-size:10px;font-weight:700;font-style:normal;border-radius:2px;flex:none;line-height:1}
.sq.sm{width:14px;height:14px;font-size:9px}
.ev{display:flex;align-items:center;gap:4px;overflow:hidden;max-width:100%;font-size:11.5px;line-height:1.3;padding:1px 3px;background:var(--surface2);color:var(--ink);border-radius:2px;min-width:0}
.ev .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ev .k{color:var(--muted);margin-left:2px}
.ev .q{color:var(--warn);font-weight:700;margin-left:2px}
.more{font-size:11px;color:var(--muted)}
.dots{display:none}
@media (max-width:640px){
  .cell{min-height:64px;padding:3px}
  .ev,.more{display:none}
  .dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
  .cnt{font-size:11px;color:var(--muted);margin-top:auto}
}
.cnt{display:none}
@media (max-width:640px){.cnt{display:block}}

/* day panel & list */
.panel{margin-top:16px}
.panel h3,.grp-h{margin:0;padding:8px 0 6px;font-size:15px;font-weight:700;color:var(--ink);border-bottom:1px solid var(--orange)}
.grp-h{margin-top:18px}
.grp-h span{font-weight:400;color:var(--muted);font-size:13px;margin-left:8px}
.grp-h span.dd{color:var(--orange);font-weight:500}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 4px;border-bottom:1px solid var(--line-soft);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font:inherit;color:inherit}
.row:hover{background:var(--surface)}
.tag{font-size:12px;font-weight:700;color:#fff;background:var(--c);padding:2px 7px;border-radius:2px;white-space:nowrap;margin-top:2px}
.tag .tl{font-weight:500}
.tag .ts{display:none}
@media (max-width:640px){.tag .tl{display:none}.tag .ts{display:inline}.tag{padding:2px 6px}}
.row .nm{font-weight:500;color:var(--ink)}
.row .cd{color:var(--muted);font-size:13px;margin-left:6px;font-variant-numeric:tabular-nums}
.row .dt{font-size:13px;color:var(--body)}
.row .kd{font-size:13px;color:var(--muted);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.mk{display:inline-block;font-size:11px;padding:0 5px;border:1px solid var(--line);border-radius:2px;color:var(--muted);margin-left:6px;vertical-align:1px}
.badge{display:inline-block;font-size:11px;padding:0 6px;border:1px solid var(--warn);border-radius:2px;color:var(--warn);background:var(--warn-bg);margin-left:6px;vertical-align:1px;white-space:nowrap}
.dday{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:2px;color:#fff;background:var(--orange);margin-bottom:3px;font-variant-numeric:tabular-nums}
.dday.d0{background:var(--danger)}
.empty{padding:28px 8px;color:var(--muted);text-align:center;font-size:14px}
/* 표 보기 */
.card{border:1px solid var(--line);border-radius:4px;margin:0 0 14px;overflow:hidden;background:var(--bg)}
.card .hd{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.card .hd .sq{width:20px;height:20px;font-size:12px}
.card .nm{font-weight:700;color:var(--ink);font-size:16px}
.card .hd .tag{margin-left:auto;margin-top:0}
.dt{width:100%;border-collapse:collapse;font-size:14px}
.dt th,.dt td{padding:8px 14px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top}
.dt th{width:34%;color:var(--muted);font-weight:500}
.dt td{color:var(--ink);font-variant-numeric:tabular-nums}
.dt tr:last-child th,.dt tr:last-child td{border-bottom:0}
.dt .sub{display:block;color:var(--muted);font-size:12.5px;font-weight:400}
.dt .na{color:var(--muted)}
.dt .tilde{color:var(--muted);margin:0 2px}
.dt a{color:var(--blue);text-decoration:none}
.dl{border:0;background:none;padding:0;font:inherit;color:var(--ink);cursor:pointer;text-align:left;font-variant-numeric:tabular-nums}
.dl:hover{text-decoration:underline}
.dl.past{color:var(--muted)}
@media (max-width:640px){.dt th{width:38%;padding:7px 10px;font-size:13px}.dt td{padding:7px 10px}}
.hidden{display:none !important}
/* 내려받기 대화상자 */
.cbs{display:flex;flex-wrap:wrap;gap:6px 14px}
.f .cbs label,.f .rng label{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--body);cursor:pointer;white-space:nowrap}
.f .cbs input,.f .rng input[type=radio]{width:16px;height:16px;margin:0;padding:0;flex:none}
.rng{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.f .rng input[type=date]{width:auto;padding:6px 8px;border:1px solid var(--line);border-radius:2px;background:var(--bg);font-size:14px}
.f .rng span{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.f h4{margin:0 0 6px;font-size:13px;font-weight:500;color:var(--muted)}
.f .mini{font-size:12px;color:var(--muted)}
.f .mini button{border:0;background:none;color:var(--blue);padding:0 4px;cursor:pointer;font-size:12px;text-decoration:underline}
/* 인쇄(PDF) 전용 영역 */
.print-only{display:none}
body.printing .page,body.printing .toast,body.printing .ovl{display:none !important}
body.printing .print-only{display:block;padding:12px;font-size:12px;color:#111;background:#fff}
.print-only h2{font-size:16px;margin:0 0 4px;color:#111}
.print-only .meta{color:#555;font-size:11px;margin-bottom:8px}
.print-only table{border-collapse:collapse;width:100%}
.print-only th,.print-only td{border:1px solid #999;padding:4px 6px;text-align:left;vertical-align:top;font-size:11px;word-break:break-word}
.print-only th{background:#eee;font-weight:700}
.print-only td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.print-only .cal-t{font-size:14px;margin:10px 0 4px;color:#111;page-break-before:auto}
.print-only table.pcal{table-layout:fixed;page-break-after:always}
.print-only .pcal th{text-align:center;padding:3px}
.print-only .pcal td{height:64px;padding:3px 4px;font-size:10px}
.print-only .pcal td.closed{background:#f1f3f6}
.print-only .pcal td.out{background:#fafafa}
.print-only .pcal .d{font-weight:700;margin-bottom:2px}
.print-only .pcal .e{display:flex;gap:3px;align-items:center;line-height:1.25;white-space:nowrap;overflow:hidden}
.print-only .pcal .e .sq{width:12px;height:12px;font-size:8px}
.print-only .pcal .e .k{color:#555}
@media print{@page{size:A4 landscape;margin:12mm}body{background:#fff}.print-only .pcal td.closed,.print-only th,.print-only .sq{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* modal */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dlg{background:var(--bg);width:100%;max-width:560px;max-height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;border-radius:4px;box-shadow:var(--shadow);padding:20px}
.dlg h2{margin:0 0 14px;font-size:18px;color:var(--ink)}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.f label{font-size:13px;color:var(--muted)}
.f input,.f select,.f textarea{padding:9px 10px;border:1px solid var(--line);border-radius:2px;background:var(--bg);width:100%}
.f textarea{min-height:70px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--body);background:var(--surface);padding:9px 10px;border-radius:2px;margin-bottom:12px;cursor:pointer}
.chk input{width:16px;height:16px;margin:3px 0 0;flex:none}
.chk b{color:var(--ink);font-weight:500}
.chk .sub{color:var(--muted);display:block}
.dlg .foot{display:flex;justify-content:space-between;gap:8px;margin-top:6px;flex-wrap:wrap}
.dlg .foot .l,.dlg .foot .r{display:flex;gap:8px}
.dlg .foot .r{margin-left:auto}
.detail{display:flex;flex-direction:column;gap:0;margin-bottom:12px;border-top:1px solid var(--line-soft)}
.dr{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line-soft);font-size:14px}
.dk{color:var(--muted);font-size:13px}
.dv{color:var(--ink);word-break:break-word}
.dlg h2 .cd{font-weight:400;color:var(--muted);font-size:14px}
.note{font-size:13px;color:var(--muted);background:var(--surface);padding:10px 12px;border-radius:2px;margin-bottom:12px;line-height:1.5}
.note code{font-size:12px;background:var(--surface2);padding:1px 4px;border-radius:2px}
.note.rev{background:var(--warn-bg);color:var(--body);border-left:3px solid var(--warn)}
.prev{max-height:220px;overflow:auto;border:1px solid var(--line);font-size:13px;margin-bottom:12px}
.prev table{border-collapse:collapse;width:100%}
.prev th{background:var(--orange-soft);color:var(--ink);font-weight:500;padding:5px 7px;text-align:left;position:sticky;top:0;font-size:12px}
.prev td{padding:4px 7px;border-top:1px solid var(--line-soft);white-space:nowrap}
.prev tr.bad td{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:2px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin:10px 0 0}
.legend .sq{margin-right:4px;vertical-align:-3px}
.legend .q{color:var(--warn);font-weight:700}
.legend .hol-l{flex-basis:100%;margin-top:2px}
.legend .r{color:var(--danger);font-weight:500}.legend .b{color:var(--sat);font-weight:500}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
<script src="data.js"></script>
</head>
<body>
<div class="page">
  <div class="rule"></div>
  <div class="head">
    <div>
      <h1>주식 권리일정 캘린더</h1>
      <div class="status" id="status">불러오는 중…</div>
    </div>
    <div class="actions"><button class="btn" id="exportBtn" type="button" title="필요한 기간·유형·항목만 골라 엑셀 또는 PDF로 저장">내려받기 (엑셀·PDF)</button></div>
  </div>

  <div class="toolbar">
    <div class="search" id="searchWrap">
      <input id="q" type="search" placeholder="종목명 또는 종목코드 검색" aria-label="종목 검색" autocomplete="off">
      <button class="clr" id="qClr" type="button" aria-label="검색어 지우기">×</button>
    </div>
    <select class="sel" id="typeSel" aria-label="권리 유형">
      <option value="">모든 유형</option>
    </select>
    <div class="chips" role="group" aria-label="확인 상태">
      <button class="chip rev" id="revChip" aria-pressed="false" type="button" title="자동 갱신으로 들어와 아직 직원이 확인하지 않은 일정만 보기">확인 필요만</button>
    </div>
    <div class="chips" role="group" aria-label="보기">
      <button class="chip" data-view="cal" aria-pressed="true" type="button">달력</button>
      <button class="chip" data-view="list" aria-pressed="false" type="button">목록</button>
    </div>
    <div class="chips hidden" id="modeChips" role="group" aria-label="목록 형식">
      <button class="chip" data-mode="table" aria-pressed="true" type="button">표</button>
      <button class="chip" data-mode="rows" aria-pressed="false" type="button">줄</button>
    </div>
  </div>

  <section id="calView">
    <div class="cal-nav">
      <div class="nav-c">
        <button class="btn nav" id="prevM" type="button" aria-label="이전 달">‹</button>
        <h2 id="mTitle"></h2>
        <button class="btn nav" id="nextM" type="button" aria-label="다음 달">›</button>
        <button class="btn nav today" id="todayM" type="button">오늘</button>
      </div>
      <span class="status" id="mCount"></span>
    </div>
    <div class="wk"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div class="grid" id="grid" role="grid"></div>
    <div class="legend" id="legend"></div>
    <div class="panel" id="dayPanel"></div>
  </section>

  <section id="listView" class="hidden">
    <div id="list"></div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="print-only" id="printArea"></div>

<script>
(function(){
'use strict';
// ---------- constants ----------
const TYPES = {
  div:{label:'배당',s:'배',c:'var(--c-div)'},
  bonus:{label:'무상증자',s:'무',c:'var(--c-bonus)'},
  split:{label:'액면분할·병합',s:'액',c:'var(--c-split)'},
  rights:{label:'유상증자(주주배정·공모)',s:'유',c:'var(--c-rights)'},

// ---------- state ----------
let db=null, userApi=null, canWrite=null;
let events=[];           // {id, ...data}
let meta=null;
let unsub=null;
const now=new Date();
let cur={y:now.getFullYear(), m:now.getMonth()};
let selDay=null; // 초기화면에서는 오늘 날짜를 선택 상태로(아래 todayStr 정의 후 설정)
let filt={q:'', type:'', view:'cal', review:false, listMode:'table'};
let deals={};            // deals 컬렉션: 접수번호별 발행가·비율·기간

// ---------- helpers ----------
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr=ymd(now);
selDay=todayStr;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600);}
function fmtDate(s){if(!s)return'';const d=new Date(s+'T00:00:00');if(isNaN(d))return s;const w='일월화수목금토'[d.getDay()];return `${s.slice(0,4)}.${s.slice(5,7)}.${s.slice(8,10)} (${w})`;}
function fmtTime(iso){if(!iso)return'';const d=new Date(iso);if(isNaN(d))return'';return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;}
function isThird(e){if(e.type!=='rights')return false;const d=e.rcpNo&&deals[e.rcpNo];const m=(d&&d.method)||'';if(m)return /제\s?3자/.test(m);if(['record','ex','sub','wr','wrx'].includes(e.kind))return false;return /제\s?3자/.test(e.detail||'');}
function typeOf(e){if(e.type==='rights')return isThird(e)?'rights3':'rights';return TYPES[e.type]?e.type:'other';}
function sqHtml(e,cls){const t=TYPES[typeOf(e)];return `<i class="sq${cls?' '+cls:''}" style="--c:${t.c}" aria-hidden="true">${t.s}</i>`;}
function typeLabel(e){return e.typeText||TYPES[typeOf(e)].label;}
function kindLabel(e){return e.kindText||KINDS[e.kind]||KINDS.other;}
function needsReview(e){return e.by==='claude'&&!e.verified;}
function daysFromToday(s){const d=new Date(s+'T00:00:00');if(isNaN(d))return NaN;return Math.round((d-new Date(todayStr+'T00:00:00'))/86400000);}
function ddayHtml(s,cls){const n=daysFromToday(s);if(!(n>=0&&n<=SOON_DAYS))return'';return `<span class="${cls||'dday'}${n===0?' d0':''}">${n===0?'오늘':'D-'+n}</span>`;}
function isBizDay(d){return d.getDay()!==0&&d.getDay()!==6&&!HOLIDAYS[ymd(d)];}
function prevBizDay(s){const d=new Date(s+'T00:00:00');if(isNaN(d))return'';do{d.setDate(d.getDate()-1);}while(!isBizDay(d));return ymd(d);}
function safeSeg(s){return String(s||'').replace(/[^A-Za-z0-9_\-.~:@+]/g,'').slice(0,60)||'x';}
function makeId(e){return `${e.market}_${safeSeg(e.code)}_${e.type}_${e.kind}_${e.date}`;}

// ---------- filtering ----------
function matches(e){
  if(filt.type&&typeOf(e)!==filt.type)return false;
  if(filt.review&&!needsReview(e))return false;
  if(filt.q){const q=filt.q.toLowerCase();if(!(String(e.name||'').toLowerCase().includes(q)||String(e.code||'').toLowerCase().includes(q)||String(e.detail||'').toLowerCase().includes(q)))return false;}
  return true;
}
function filtered(){return events.filter(matches).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.name||'').localeCompare(b.name||'','ko'));}

// ---------- render ----------
function renderStatus(){
  const n=events.length;
  let s='';
  if(db===null&&!events.length){s=window.__SNAP?'불러오는 중…':'일정 데이터를 불러오지 못했습니다. 새로고침해 주세요.';}
  else{
    s=`등록 일정 <b>${n}건</b>`;
    const rv=events.filter(needsReview).length;
    if(rv)s+=` · <span class="warn">확인 필요 <b>${rv}건</b></span>`;
    if(meta&&meta.lastUpdate)s+=` · 마지막 갱신 <b>${fmtTime(meta.lastUpdate)}</b>`;
    else{const last=events.reduce((m,e)=>e.updatedAt>m?e.updatedAt:m,'');if(last)s+=` · 마지막 수정 <b>${fmtTime(last)}</b>`;}
    if(meta&&meta.note)s+=` · ${esc(meta.note)}`;
    s+=' · 공시 기반 자동 갱신(수기 입력 없음)';
    if(window.__SNAP)s+=` · <b>${fmtTime(__SNAP.at)} 기준</b> · 매일 20시 이후 자동 반영`;
  }
  $('status').innerHTML=s;
}
function evHtml(e){return `<div class="ev" title="${esc(e.name)} ${esc(typeLabel(e))} ${esc(kindLabel(e))}${needsReview(e)?' (확인 필요)':''}">${sqHtml(e)}<span class="t">${esc(e.name||e.code)}<span class="k">${esc(kindLabel(e))}</span>${needsReview(e)?'<span class="q">?</span>':''}</span></div>`;}
function renderCal(){
  const first=new Date(cur.y,cur.m,1);
  const start=new Date(first);start.setDate(1-first.getDay());
  const list=filtered();
  const byDay={};list.forEach(e=>{(byDay[e.date]=byDay[e.date]||[]).push(e);});
  $('mTitle').textContent=`${cur.y}년 ${cur.m+1}월`;
  const mPrefix=`${cur.y}-${pad(cur.m+1)}`;
  const mc=list.filter(e=>e.date.startsWith(mPrefix)).length;
  $('mCount').textContent=`이달 ${mc}건`;
  let h='';
  const d=new Date(start);
  const twRow=Math.floor(Math.round((new Date(todayStr+'T00:00:00')-start)/86400000)/7); // 오늘이 속한 주(행)
  for(let i=0;i<42;i++){
    const s=ymd(d);const out=d.getMonth()!==cur.m;const wk=d.getDay()===0||d.getDay()===6;const hol=HOLIDAYS[s];
    const evs=byDay[s]||[];
    const closed=wk||!!hol;
    const cw=i>=twRow*7&&i<twRow*7+7;
    const cls=['cell',out?'out':'',closed?'closed':'',d.getDay()===0||hol?'red':'',d.getDay()===6&&!hol?'blue':'',s===todayStr?'today':'',cw?'cw':'',cw&&d.getDay()===0?'cw-l':'',cw&&d.getDay()===6?'cw-r':'',s===selDay?'sel':''].filter(Boolean).join(' ');
    h+=`<button type="button" class="${cls}" data-d="${s}" role="gridcell" aria-label="${s} 일정 ${evs.length}건">`;
    h+=`<span class="dn">${d.getDate()}${hol?`<span class="hol">${esc(hol)}</span>`:''}</span>`;
    // 10건까지는 전부 표시, 초과하면 10건 + '+N건'으로 접음(칸을 누르면 아래 패널에 전체 표시)
    const MAXV=10;
    (evs.length>MAXV?evs.slice(0,MAXV):evs).forEach(e=>h+=evHtml(e));
    if(evs.length>MAXV)h+=`<span class="more">+${evs.length-MAXV}건 (클릭하면 전체 표시)</span>`;
    if(evs.length){h+=`<span class="dots">${evs.slice(0,8).map(e=>sqHtml(e,'sm')).join('')}</span><span class="cnt">${evs.length}건</span>`;}
    h+='</button>';
    d.setDate(d.getDate()+1);
    if(i>=34&&d.getMonth()!==cur.m&&d.getDay()===0)break;
  }
  $('grid').innerHTML=h;
  renderDay();
}
function rowHtml(e){
  return `<button type="button" class="row" data-id="${esc(e.id)}"><span class="tag" style="--c:${TYPES[typeOf(e)].c}"><span class="tl">${esc(typeLabel(e))}</span><span class="ts">${TYPES[typeOf(e)].s}</span></span><span><span class="nm">${esc(e.name||'')}</span><span class="cd">${esc(e.code||'')}</span>${needsReview(e)?'<span class="badge">확인 필요</span>':''}${e.detail?`<div class="dt">${esc(e.detail)}</div>`:''}</span><span class="kd">${ddayHtml(e.date)}${ddayHtml(e.date)?'<br>':''}${esc(kindLabel(e))}<br>${fmtDate(e.date)}</span></button>`;
}
function renderDay(){
  const p=$('dayPanel');
  if(!selDay){p.innerHTML='';return;}
  const evs=filtered().filter(e=>e.date===selDay);
  const hol=HOLIDAYS[selDay];
  p.innerHTML=`<h3>${fmtDate(selDay)}${hol?` <span style="color:var(--danger);font-weight:400;font-size:13px">${esc(hol)}</span>`:''} <span style="font-weight:400;color:var(--muted);font-size:13px">${evs.length}건</span></h3>`+(evs.length?evs.map(rowHtml).join(''):'<div class="empty">이 날짜에 등록된 일정이 없습니다.</div>');
}
function renderList(){
  if(filt.listMode==='table'){renderTable();return;}
  const list=filtered();
  const from=todayStr;
  const up=list.filter(e=>e.date>=from), past=list.filter(e=>e.date<from);

  if(!list.length){h='<div class="empty">'+(filt.q?'검색 결과가 없습니다.':filt.review?'확인이 필요한 일정이 없습니다.':'등록된 일정이 없습니다.')+'</div>';}
  else{
    let lastD='';
    up.forEach(e=>{if(e.date!==lastD){lastD=e.date;const hol=HOLIDAYS[e.date];const dn=daysFromToday(e.date);h+=`<div class="grp-h">${fmtDate(e.date)}${hol?`<span style="color:var(--danger)">${esc(hol)}</span>`:''}${dn===0?'<span class="dd">오늘</span>':dn>0&&dn<=SOON_DAYS?`<span class="dd">D-${dn}</span>`:''}</div>`;}h+=rowHtml(e);});
    if(past.length){h+=`<div class="grp-h" style="border-color:var(--line)">지난 일정<span>${past.length}건</span></div>`;past.slice(-40).reverse().forEach(e=>h+=rowHtml(e));}
  }
  $('list').innerHTML=h;

// ---------- 표 보기: 같은 종목·같은 공시(딜)를 한 표로 ----------
function dealKey(e){
  const d=e.rcpNo?deals[e.rcpNo]:null;
  if(e.type==='rights'){
    const m=(d&&d.method)||'';
    if(/^주주/.test(m)||['record','sub','wr','wrx','ex'].includes(e.kind))return e.code+'_rights_SHR';
    return e.code+'_rights_'+((d&&d.shares)||e.rcpNo||'x');
  }
  return e.code+'_'+e.type;
}
function dealFor(g){
  // 그룹의 접수번호 중 가장 최근 것의 deals 문서, 없으면 종목·유형이 같은 수동 문서
  const rcps=[...new Set(g.evs.map(e=>e.rcpNo).filter(Boolean))].sort();
  for(let i=rcps.length-1;i>=0;i--){if(deals[rcps[i]])return deals[rcps[i]];}
  return Object.values(deals).find(d=>d.code===g.code&&d.type===g.type&&!d.rcpNo)||null;
}
function dCell(e){
  if(!e)return'<span class="na">미정</span>';
  const n=daysFromToday(e.date);const past=n<0;
  return `<button type="button" class="dl${past?' past':''}" data-id="${esc(e.id)}">${fmtDate(e.date)}${ddayHtml(e.date)?' '+ddayHtml(e.date):''}${needsReview(e)?' <span class="badge">확인 필요</span>':''}</button>`;
}
function pCell(st,en,evStart){
  if(evStart&&!st)st=evStart.date;
  if(!st)return'<span class="na">미정</span>';
  const a=evStart?dCell(evStart):fmtDate(st);
  return en?`${a} <span class="tilde">~</span> ${fmtDate(en)}`:a;
}
function won(v){return v?(/원$|미정|미확정/.test(v)?v:v+'원'):'';}
function renderTable(){
  const list=filtered();
  if(!list.length){$('list').innerHTML='<div class="empty">'+(filt.q?'검색 결과가 없습니다.':filt.review?'확인이 필요한 일정이 없습니다.':'등록된 일정이 없습니다.')+'</div>';return;}
  const groups={};
  list.forEach(e=>{const k=dealKey(e);(groups[k]=groups[k]||{key:k,code:e.code,name:e.name,type:e.type,evs:[]}).evs.push(e);});
  const gs=Object.values(groups);
  gs.forEach(g=>{g.evs.sort((a,b)=>a.date<b.date?-1:1);const up=g.evs.filter(e=>e.date>=todayStr);g.next=up.length?up[0].date:'';g.last=g.evs[g.evs.length-1].date;});
  const upcoming=gs.filter(g=>g.next).sort((a,b)=>a.next<b.next?-1:a.next>b.next?1:a.name.localeCompare(b.name,'ko'));
  const past=gs.filter(g=>!g.next).sort((a,b)=>b.last<a.last?-1:1);
  let h='';
  const sec=(title,arr,cnt)=>{h+=`<div class="grp-h">${title}<span>${cnt}</span></div>`;arr.forEach(g=>h+=cardHtml(g));};
  if(upcoming.length)sec('다가오는 일정',upcoming,`${upcoming.length}건 (종목·공시 기준)`);
  if(past.length)sec('지난 일정',past.slice(0,30),`${past.length}건`);
  $('list').innerHTML=h;
}
function cardHtml(g){
  const d=dealFor(g)||{};const t=TYPES[typeOf(g.evs[0])];
  const by=k=>g.evs.find(e=>e.kind===k);
  const byText=re=>g.evs.find(e=>e.kind==='other'&&re.test(e.kindText||''));
  const rows=[];const R=(k,v)=>{if(v!==undefined&&v!==null&&v!=='')rows.push([k,v]);};
  const src=(()=>{const e=g.evs.find(x=>x.source)||{};const s=d.source||e.source||'';if(!s)return'';const rc=d.rcpNo||e.rcpNo||'';return `<a href="${esc(s)}" target="_blank" rel="noopener">${/dart\.fss/.test(s)?'DART 공시 원문':'출처 열기'}</a>${rc?` <span class="sub">${esc(d.report||'')} · 접수번호 ${esc(rc)}</span>`:''}`;})();
  const review=g.evs.some(needsReview);
  if(g.type==='rights'){
    const shr=/^주주/.test(d.method||'')||g.key.endsWith('_SHR');
    const spec=[d.shares?`신주 ${d.shares}주`:'',d.ratio?`1주당 ${d.ratio}주 배정`:''].filter(Boolean).join(' · ');
    R('권리구분',`${esc(d.method||(shr?'주주배정':'유상증자'))} 유상증자${spec?`<span class="sub">${esc(spec)}</span>`:''}`);
    if(shr){
      R('신주배정기준일',dCell(by('record')));
      R('권리락일',dCell(by('ex')));
      R('신주인수권증서',d.wrName?esc(d.wrName):'<span class="na">미정</span><span class="sub">거래소 상장 공시 후 확정</span>');
      R('권리 거래기간',pCell(d.wrStart,d.wrEnd,by('wr')));
      R('구주주 청약기간',pCell(d.subStart,d.subEnd,by('sub')));
      const pub=byText(/일반공모/);if(d.pubStart||pub)R('일반공모 청약',pCell(d.pubStart,d.pubEnd,pub));
      R('1차(예정) 발행가',d.price1?won(d.price1):'<span class="na">미정</span>');
      R('최종(확정) 발행가',d.priceFinal?won(d.priceFinal):`<span class="na">미확정</span>${d.priceFinalDate?`<span class="sub">확정발행가 결정일 ${fmtDate(d.priceFinalDate)} — 공시 후 자동 반영</span>`:''}`);

function errMsg(err){
  const c=err&&err.code;

  if(c==='quota_exceeded')return'저장 한도(5,000건)에 도달했습니다. 지난 일정을 정리해 주세요.';
  if(c==='resource_exhausted')return'요청이 너무 많습니다. 잠시 후 다시 시도하세요.';
  return'저장하지 못했습니다. 잠시 후 다시 시도하세요.';
}

function exportRows(opt){

  else if(opt.range==='custom'){from=opt.from||'';to=opt.to||'';}
  const rows=events.filter(e=>{

async function saveFile(filename,data){
  const dl=(window.claude&&window.claude.use)?await claude.use('downloads').catch(()=>null):null;
  if(dl){await dl.save({filename,data});return'saved';}
  // 예비: 브라우저 직접 다운로드
  const blob=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);return'saved';
}
// 달력 형식: 기간에 걸친 달마다 주 단위 7칸 표. 각 칸 = "날짜 (요일) 휴장명" + 일정 줄들
function calMonths(rows,from,to){
  if(!rows.length)return[];
  const a=from||rows[0].date, b=to||rows[rows.length-1].date;
  const out=[];let y=+a.slice(0,4),m=+a.slice(5,7)-1;const ey=+b.slice(0,4),em=+b.slice(5,7)-1;
  while(y<ey||(y===ey&&m<=em)){out.push({y,m});m++;if(m>11){m=0;y++;}}
  return out;
}
function calGrid(rows,y,m){ // -> {title, weeks:[[{date,inMonth,closed,hol,label,lines}]]}
  const byDay={};rows.forEach(e=>{(byDay[e.date]=byDay[e.date]||[]).push(e);});
  const first=new Date(y,m,1);const start=new Date(first);start.setDate(1-first.getDay());
  const weeks=[];const d=new Date(start);
  for(let w=0;w<6;w++){const wk=[];for(let i=0;i<7;i++){const s=ymd(d);const inMonth=d.getMonth()===m;const hol=HOLIDAYS[s]||'';const closed=d.getDay()===0||d.getDay()===6||!!hol;
      const evs=(byDay[s]||[]);const lines=evs.map(e=>`${TYPES[typeOf(e)].s} ${e.name||e.code} ${kindLabel(e)}${needsReview(e)?' (확인 필요)':''}`);
      wk.push({date:s,inMonth,closed,hol,label:`${d.getDate()} (${'일월화수목금토'[d.getDay()]})${hol?' '+hol:''}`,lines,evs});d.setDate(d.getDate()+1);}
    weeks.push(wk);if(d.getMonth()!==m&&d.getDay()===0&&w>=3)break;}
  return {title:`${y}년 ${m+1}월`,weeks};
}
function calSheet(rows,y,m){
  const g=calGrid(rows,y,m);
  const aoa=[[{v:g.title,s:5}],['일','월','화','수','목','금','토'].map(v=>({v,s:4}))];
  const heights=[24,20];
  g.weeks.forEach(wk=>{aoa.push(wk.map(c=>({v:c.inMonth?[c.label,...c.lines].join('\n'):'',s:c.closed||!c.inMonth?3:2})));const mx=Math.max(1,...wk.map(c=>c.inMonth?1+c.lines.length:1));heights.push(Math.min(409,14*mx+6));});
  return {name:`달력 ${y}-${pad(m+1)}`,aoa,widths:[26,26,26,26,26,26,26],heights,freeze:false};
}
function calPrintHtml(rows,y,m){
  const g=calGrid(rows,y,m);
  return `<h3 class="cal-t">${esc(g.title)}</h3><table class="pcal"><thead><tr>${['일','월','화','수','목','금','토'].map(w=>`<th>${w}</th>`).join('')}</tr></thead><tbody>${g.weeks.map(wk=>`<tr>${wk.map(c=>`<td class="${c.closed||!c.inMonth?'closed':''}${c.inMonth?'':' out'}">${c.inMonth?`<div class="d">${esc(c.label)}</div>${c.evs.map(e=>`<div class="e"><i class="sq" style="--c:${TYPES[typeOf(e)].c}">${TYPES[typeOf(e)].s}</i>${esc(e.name||e.code)} <span class="k">${esc(kindLabel(e))}</span></div>`).join('')}`:''}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}
async function exportExcel(opt){
  const {rows,from,to}=exportRows(opt);
  if(!rows.length){toast('조건에 맞는 일정이 없습니다.');return;}
  const cols=COLS.filter(c=>opt.cols.includes(c[0]));
  const aoa=[cols.map(c=>c[1])].concat(rows.map(e=>cols.map(c=>c[2](e))));
  const widths=cols.map(c=>({date:11,dow:5,name:16,code:9,type:22,kind:14,detail:60,method:18,price:14,ratio:34,verify:9,rcp:16,src:52}[c[0]]||14));
  const info=[['주식 권리일정 캘린더 내려받기'],['기간',(from||'전체')+(to?' ~ '+to:'')],['건수',rows.length],['생성',fmtTime(new Date().toISOString())],['출처','DART 공시 기반 자동 갱신. 확인 필요 항목은 원문 대조 전 자료입니다.']];
  const sheets=[];
  if(opt.fmt!=='cal')sheets.push({name:'목록',aoa,widths,filter:true});
  if(opt.fmt!=='list')calMonths(rows,from,to).forEach(({y,m})=>sheets.push(calSheet(rows,y,m)));
  sheets.push({name:'정보',aoa:info,widths:[10,60]});
  const buf=buildXlsx(sheets);
  const fn=`권리일정_${(from||'전체').replace(/-/g,'')}${to?'-'+to.replace(/-/g,''):''}.xlsx`;
  try{await saveFile(fn,buf);toast(`엑셀 ${rows.length}건 저장`);}catch(err){toast(err&&err.code==='declined'?'저장을 취소했습니다.':'저장하지 못했습니다. ('+((err&&err.code)||'오류')+')');}
}
function exportPdf(opt){
  const {rows,from,to}=exportRows(opt);
  if(!rows.length){toast('조건에 맞는 일정이 없습니다.');return;}
  const cols=COLS.filter(c=>opt.cols.includes(c[0]));
  const pa=$('printArea');
  const calH=opt.fmt==='list'?'':calMonths(rows,from,to).map(({y,m})=>calPrintHtml(rows,y,m)).join('');
  const listH=opt.fmt==='cal'?'':`<h3 class="cal-t">목록</h3><table><thead><tr>${cols.map(c=>`<th>${esc(c[1])}</th>`).join('')}</tr></thead><tbody>${rows.map(e=>`<tr>${cols.map(c=>`<td class="${['date','code','rcp','price'].includes(c[0])?'num':''}">${esc(c[2](e))}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  pa.innerHTML=`<h2>주식 권리일정</h2><div class="meta">기간 ${esc(from||'전체')}${to?' ~ '+esc(to):''} · ${rows.length}건 · 생성 ${fmtTime(new Date().toISOString())} · DART 공시 기반 자동 갱신(확인 필요 항목은 원문 대조 전)</div>${calH}${listH}`;
  document.body.classList.add('printing');
  const done=()=>{document.body.classList.remove('printing');window.removeEventListener('afterprint',done);};
  window.addEventListener('afterprint',done);
  setTimeout(()=>{window.print();setTimeout(done,1500);},50);
}

  </div>`;
  document.body.appendChild(ovl);
  const g=id=>ovl.querySelector('#'+id);
  const read=()=>({fmt:(ovl.querySelector('input[name=xf]:checked')||{}).value||'both',range:(ovl.querySelector('input[name=xr]:checked')||{}).value||'d30',from:g('xFrom').value,to:g('xTo').value,types:[...ovl.querySelectorAll('#xTypes input:checked')].map(i=>i.value),cols:[...ovl.querySelectorAll('#xCols input:checked')].map(i=>i.value),review:g('xReview').checked});

  apply(pref);

  ovl.addEventListener('change',ev=>{if(ev.target.id==='xFrom'||ev.target.id==='xTo'){ovl.querySelectorAll('input[name=xr]').forEach(i=>i.checked=i.value==='custom');}upd();});
